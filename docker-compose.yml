# Claude Code isolado do host. O único requisito da máquina é Docker: o
# toolchain, o Claude Code, o caveman e o rtk são instalados na imagem. Do
# filesystem do host só é montado este repositório — mais o ~/.gitconfig e o
# login do Claude, ambos read-only e copiados uma vez pelo entrypoint, que
# ignora qualquer um dos dois que não exista na máquina.
#
#   docker compose up -d --build
#   docker compose exec claude caveman claude
services:
  claude:
    build:
      # O contexto é a raiz do repositório porque o build precisa do
      # `.tool-versions` — é ele que define o toolchain da imagem.
      context: .
      dockerfile: docker/claude/Dockerfile
      args:
        # O bind do repositório é o único ponto em que o container escreve no
        # host: o usuário precisa do mesmo uid/gid para não trocar o dono dos
        # arquivos.
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: code/claude-dev
    container_name: code
    working_dir: /workspace/code
    # Reaproveita o init do Docker para que `sleep infinity` como PID 1 não
    # deixe zumbis dos processos que o Claude e o caveman disparam.
    init: true
    environment:
      # Resolvidos por ${env.*} em docker/maven/settings.xml (GitHub Packages).
      GITHUB_USERNAME: ${GITHUB_USERNAME:?exporte GITHUB_USERNAME}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?exporte GITHUB_TOKEN com scope read:packages}
    volumes:
      - .:/workspace/code
      # Home do container: login do Claude, histórico, ~/.caveman e config do
      # rtk sobrevivem a `down`/`up`. Semeado a partir da imagem na criação.
      - claude-home:/home/dev
      # Cache Maven em volume nomeado, e não em bind de ~/.m2: o container não
      # depende de nada instalado no host. O preço é baixar as dependências uma
      # vez por volume.
      - maven-repo:/home/dev/.m2/repository
      - ./docker/maven/settings.xml:/home/dev/.m2/settings.xml:ro
      # Configuração do git e login do Claude, read-only, copiados uma vez pelo
      # entrypoint. São os dois únicos arquivos do host além do repositório.
      #
      # Sintaxe curta de propósito, para valer em qualquer Compose v2: quando o
      # arquivo não existe no host, o Docker monta um diretório vazio no lugar
      # dele e é o entrypoint que ignora o que não for arquivo regular
      # não-vazio. Veja "Host sem esses arquivos" no README.
      - ${HOME}/.gitconfig:/seed/gitconfig:ro
      - ${HOME}/.claude/.credentials.json:/seed/claude-credentials.json:ro
      #
      # No Compose v2.32+ (`docker compose version`) os dois blocos abaixo
      # substituem as duas linhas acima e resolvem melhor: `required: false`
      # pula o mount quando o arquivo não existe, e `create_host_path: false`
      # impede o Docker de criar um diretório no lugar dele no host.
      # Versão anterior à v2.32 reprova a validação do arquivo inteiro com
      # "additional properties 'required' not allowed", e o container nem sobe.
      #
      # - type: bind
      #   source: ${HOME}/.gitconfig
      #   target: /seed/gitconfig
      #   read_only: true
      #   required: false
      #   bind:
      #     create_host_path: false
      # - type: bind
      #   source: ${HOME}/.claude/.credentials.json
      #   target: /seed/claude-credentials.json
      #   read_only: true
      #   required: false
      #   bind:
      #     create_host_path: false

volumes:
  claude-home:
  maven-repo:
