# Claude Code isolado do host. O único requisito da máquina é Docker: o
# toolchain, o Claude Code, o caveman e o rtk são instalados na imagem. Do
# filesystem do host só é montado este repositório — mais, se existirem, o
# ~/.gitconfig e o login do Claude, ambos read-only, copiados uma vez e
# opcionais (`required: false`, Compose v2.32+).
#
#   docker compose up -d --build
#   docker compose exec claude caveman claude
services:
  claude:
    build:
      # O contexto é a raiz do repositório porque o build precisa do
      # `.tool-versions` — é ele que define o toolchain da imagem.
      context: .
      dockerfile: docker/claude/Dockerfile
      args:
        # O bind do repositório é o único ponto em que o container escreve no
        # host: o usuário precisa do mesmo uid/gid para não trocar o dono dos
        # arquivos.
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: pnb-code/claude-dev
    container_name: pnb-code
    working_dir: /workspace/pnb-code
    # Reaproveita o init do Docker para que `sleep infinity` como PID 1 não
    # deixe zumbis dos processos que o Claude e o caveman disparam.
    init: true
    environment:
      # Resolvidos por ${env.*} em docker/maven/settings.xml (GitHub Packages).
      GITHUB_USERNAME: ${GITHUB_USERNAME:?exporte GITHUB_USERNAME}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?exporte GITHUB_TOKEN com scope read:packages}
    volumes:
      - .:/workspace/pnb-code
      # Home do container: login do Claude, histórico, ~/.caveman e config do
      # rtk sobrevivem a `down`/`up`. Semeado a partir da imagem na criação.
      - claude-home:/home/dev
      # Cache Maven em volume nomeado, e não em bind de ~/.m2: o container não
      # depende de nada instalado no host. O preço é baixar as dependências uma
      # vez por volume.
      - maven-repo:/home/dev/.m2/repository
      - ./docker/maven/settings.xml:/home/dev/.m2/settings.xml:ro
      # Configuração do git do host, copiada uma vez pelo entrypoint.
      # `required: false` deixa o container subir em máquina que não tem o
      # arquivo; `create_host_path: false` impede o Docker de criar um
      # diretório vazio no lugar dele.
      - type: bind
        source: ${HOME}/.gitconfig
        target: /seed/gitconfig
        read_only: true
        required: false
        bind:
          create_host_path: false
      # Idem para o login do Claude: atalho para quem já usa o Claude Code no
      # host. Sem ele, `claude` pede login na primeira sessão.
      - type: bind
        source: ${HOME}/.claude/.credentials.json
        target: /seed/claude-credentials.json
        read_only: true
        required: false
        bind:
          create_host_path: false

volumes:
  claude-home:
  maven-repo:
